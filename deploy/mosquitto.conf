listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
autosave_interval 5
autosave_on_changes true
max_inflight_messages 16
max_queued_messages 2000
max_queued_bytes 4096000
message_size_limit 2048
memory_limit 67108864
log_dest stdout
log_type error
log_type warning
log_type notice
